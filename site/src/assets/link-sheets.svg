<svg xmlns="http://www.w3.org/2000/svg" class="link-sheets" viewBox="0 0 640 280" role="img" aria-labelledby="ls-title ls-desc">
  <title id="ls-title">One template edit and one field per product put the link on every page</title>
  <desc id="ls-desc">
    Two inputs on the left, one result on the right. Top left, the theme,
    edited once: the product template gains one piece of code, which prints a
    link element when the product's sheet address field is set. Bottom left,
    the field, one per product: anorak and parka carry their sheet addresses,
    beanie has none yet. Both feed the pages on the right: the anorak and
    parka pages carry the link element in their head, the beanie page carries
    none.
  </desc>
  <style>
    .link-sheets .label { font-family: var(--sans, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Arial, sans-serif); font-size: 11px; letter-spacing: .09em; fill: var(--ink-soft, #5a554c); text-anchor: middle; }
    .link-sheets .kind  { font-family: var(--body, Charter, Georgia, serif); font-style: italic; font-size: 13px; fill: var(--ink, #1a1814); text-anchor: middle; }
    .link-sheets .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; fill: var(--ink, #1a1814); }
    .link-sheets .mono-soft { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; fill: var(--ink-soft, #5a554c); }
    .link-sheets .small { font-family: var(--sans, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Arial, sans-serif); font-size: 10px; fill: var(--ink-soft, #5a554c); text-anchor: start; }
    .link-sheets .box   { fill: none; stroke: var(--rule, #d9d2c2); stroke-width: 1; }
    .link-sheets .doc   { fill: var(--ink, #1a1814); }
    .link-sheets .none  { fill: var(--paper, #f7f4ed); stroke: var(--rule, #d9d2c2); stroke-width: 1; }
    .link-sheets .link  { stroke: var(--ink, #1a1814); stroke-width: 1.25; fill: none; }
    .link-sheets .head  { fill: var(--ink, #1a1814); }
    .link-sheets .chain { stroke: var(--rule, #d9d2c2); stroke-width: 1; }
  </style>

  <!-- column labels -->
  <text class="label" x="160" y="30">THE THEME</text>
  <text class="kind"  x="160" y="48">edited once</text>
  <text class="label" x="505" y="30">YOUR PAGES</text>
  <text class="kind"  x="505" y="48">as served</text>

  <!-- the template, once -->
  <rect class="box" x="40" y="68" width="240" height="62" rx="6"/>
  <text class="mono-soft" x="52" y="86">the product template</text>
  <text class="small" x="52" y="104">if the sheet address is set, print</text>
  <text class="mono" x="52" y="120">&lt;link rel="alternate" href="…"&gt;</text>

  <!-- the field, per product -->
  <text class="label" x="160" y="162">THE FIELD</text>
  <text class="kind"  x="160" y="180">one per product</text>
  <rect class="box" x="40" y="196" width="240" height="64" rx="6"/>
  <text class="mono" x="52" y="214">anorak</text>
  <text class="mono-soft" x="110" y="214">…/anorak.en.json</text>
  <text class="mono" x="52" y="232">parka</text>
  <text class="mono-soft" x="110" y="232">…/parka.en.json</text>
  <text class="mono" x="52" y="250">beanie</text>
  <text class="small" x="110" y="250">empty, no sheet yet</text>

  <!-- both feed the pages -->
  <path class="link" d="M 288,99 C 315,99 315,146 340,146"/>
  <path class="link" d="M 288,228 C 315,228 315,146 340,146"/>
  <line class="link" x1="340" y1="146" x2="386" y2="146"/>
  <path class="head" d="M 394,146 L 384,141.5 L 384,150.5 Z"/>
  <text class="small" x="364" y="136" text-anchor="middle">prints</text>

  <!-- the pages -->
  <line class="chain" x1="402" y1="94" x2="402" y2="198"/>
  <circle class="doc" cx="402" cy="94" r="4"/>
  <text class="mono" x="412" y="98">/product/anorak</text>
  <text class="mono-soft" x="412" y="114">&lt;link … href="…/anorak.en.json"&gt;</text>

  <circle class="doc" cx="402" cy="146" r="4"/>
  <text class="mono" x="412" y="150">/product/parka</text>
  <text class="mono-soft" x="412" y="166">&lt;link … href="…/parka.en.json"&gt;</text>

  <circle class="none" cx="402" cy="198" r="4"/>
  <text class="mono" x="412" y="202">/product/beanie</text>
  <text class="small" x="412" y="218">no link, until its field is set</text>
</svg>
