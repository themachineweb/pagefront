<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 322" role="img"
     aria-labelledby="layers-title layers-desc">
  <title id="layers-title">A page in the human web, linked to a sheet in the Machine Web</title>
  <desc id="layers-desc">Two layers of the web, side by side. The human web is presentation: a product page is one document among many in it, and people read it. The Machine Web is data: a Pagefront Sheet is one document among many in it, and machines read it. The page links to the sheet, and both are served from the publisher's own domain.</desc>

  <!-- Cloud, users and robot outlines are Tabler Icons (MIT).
       Colours read the page's custom properties when inlined, and fall back to
       the literal palette when loaded as <img>, where custom properties do not
       cross the document boundary. -->
  <style>
    .cloud { fill: none; stroke: var(--rule, #d9d2c2); stroke-width: 1; stroke-linecap: round; stroke-linejoin: round; }
    .peer  { fill: var(--rule, #d9d2c2); }
    .doc   { fill: var(--ink, #1a1814); }
    .link  { stroke: var(--ink, #1a1814); stroke-width: 1.25; }
    .arrowhead { fill: var(--ink, #1a1814); }
    .read  { stroke: var(--ink-soft, #5a554c); stroke-width: 1; }
    .readhead { fill: var(--ink-soft, #5a554c); }
    .ico path { fill: none; stroke: var(--ink-soft, #5a554c); stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
    .layer-name { font-family: var(--sans, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, Arial, sans-serif);
                  font-size: 11px; letter-spacing: .09em; fill: var(--ink-soft, #5a554c); text-anchor: middle; }
    .layer-kind { font-family: var(--body, Charter, Georgia, serif); font-style: italic;
                  font-size: 13px; fill: var(--ink, #1a1814); text-anchor: middle; }
    .path-label { font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
                  font-size: 11px; fill: var(--ink, #1a1814); }
  </style>

  <text class="layer-name" x="120" y="24">THE HUMAN WEB</text>
  <text class="layer-kind" x="120" y="44">presentation</text>
  <text class="layer-name" x="520" y="24">THE MACHINE WEB</text>
  <text class="layer-kind" x="520" y="44">data</text>

  <g transform="translate(0 16)">
    <g transform="translate(0 -6) scale(10)">
      <path class="cloud" vector-effect="non-scaling-stroke" d="M6.657 18c-2.572 0 -4.657 -2.007 -4.657 -4.483c0 -2.475 2.085 -4.482 4.657 -4.482c.393 -1.762 1.794 -3.2 3.675 -3.773c1.88 -.572 3.956 -.193 5.444 1c1.488 1.19 2.162 3.007 1.77 4.769h.99c1.913 0 3.464 1.56 3.464 3.486c0 1.927 -1.551 3.487 -3.465 3.487h-11.878"/>
    </g>
    <circle class="peer" cx="86" cy="112" r="4"/>
    <circle class="peer" cx="126" cy="92" r="4"/>
    <circle class="peer" cx="166" cy="112" r="4"/>

    <g transform="translate(400 -6) scale(10)">
      <path class="cloud" vector-effect="non-scaling-stroke" d="M6.657 18c-2.572 0 -4.657 -2.007 -4.657 -4.483c0 -2.475 2.085 -4.482 4.657 -4.482c.393 -1.762 1.794 -3.2 3.675 -3.773c1.88 -.572 3.956 -.193 5.444 1c1.488 1.19 2.162 3.007 1.77 4.769h.99c1.913 0 3.464 1.56 3.464 3.486c0 1.927 -1.551 3.487 -3.465 3.487h-11.878"/>
    </g>
    <circle class="peer" cx="486" cy="112" r="4"/>
    <circle class="peer" cx="526" cy="92" r="4"/>
    <circle class="peer" cx="566" cy="112" r="4"/>

    <circle class="doc" cx="126" cy="145" r="5.5"/>
    <text class="path-label" x="126" y="166" text-anchor="middle">/product/anorak</text>

    <circle class="doc" cx="530" cy="145" r="5.5"/>
    <text class="path-label" x="530" y="166" text-anchor="middle">/product/anorak.json</text>

    <line class="link" x1="136" y1="145" x2="516" y2="145"/>
    <path class="arrowhead" d="M 521,145 L 511,140.5 L 511,149.5 Z"/>

    <line class="read" x1="120" y1="238" x2="120" y2="200"/>
    <path class="readhead" d="M 120,194 L 115,204 L 125,204 Z"/>
    <g class="ico" transform="translate(107 245) scale(1.0833)">
      <path d="M5 7a4 4 0 1 0 8 0a4 4 0 1 0 -8 0" vector-effect="non-scaling-stroke"/>
      <path d="M3 21v-2a4 4 0 0 1 4 -4h4a4 4 0 0 1 4 4v2" vector-effect="non-scaling-stroke"/>
      <path d="M16 3.13a4 4 0 0 1 0 7.75" vector-effect="non-scaling-stroke"/>
      <path d="M21 21v-2a4 4 0 0 0 -3 -3.85" vector-effect="non-scaling-stroke"/>
    </g>

    <line class="read" x1="520" y1="238" x2="520" y2="200"/>
    <path class="readhead" d="M 520,194 L 515,204 L 525,204 Z"/>
    <g class="ico" transform="translate(507 245) scale(1.0833)">
      <path d="M6 6a2 2 0 0 1 2 -2h8a2 2 0 0 1 2 2v4a2 2 0 0 1 -2 2h-8a2 2 0 0 1 -2 -2l0 -4" vector-effect="non-scaling-stroke"/>
      <path d="M12 2v2" vector-effect="non-scaling-stroke"/>
      <path d="M9 12v9" vector-effect="non-scaling-stroke"/>
      <path d="M15 12v9" vector-effect="non-scaling-stroke"/>
      <path d="M5 16l4 -2" vector-effect="non-scaling-stroke"/>
      <path d="M15 14l4 2" vector-effect="non-scaling-stroke"/>
      <path d="M9 18h6" vector-effect="non-scaling-stroke"/>
      <path d="M10 8v.01" vector-effect="non-scaling-stroke"/>
      <path d="M14 8v.01" vector-effect="non-scaling-stroke"/>
    </g>
  </g>
</svg>
