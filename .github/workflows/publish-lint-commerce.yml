# Publishes @pagefront/lint-commerce to npm through npm trusted publishing
# (docs.npmjs.com/trusted-publishers): the registry accepts the GitHub OIDC
# token for this repository and this workflow file, so no npm token and no
# second factor are involved. Configured on npmjs.com under the package's
# Trusted Publishers as themachineweb / pagefront / publish-lint-commerce.yml.
#
# Runs on a tag of the form lint-commerce-v<version>; the tag must match the
# version in commerce/lint/package.json. Provenance is off because the
# repository is private, where npm does not support it.
name: Publish lint-commerce

on:
  push:
    tags:
      - 'lint-commerce-v*'

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      - run: npm ci
      - name: Check the tag matches the package version
        run: |
          version=$(node -p "require('./commerce/lint/package.json').version")
          test "${GITHUB_REF_NAME}" = "lint-commerce-v${version}" \
            || { echo "tag ${GITHUB_REF_NAME} does not match package version ${version}"; exit 1; }
      # lint-commerce resolves @pagefront/lint-core to the workspace copy,
      # whose entry point is its build output.
      - run: npm run build -w @pagefront/lint-core
      - run: npm publish -w @pagefront/lint-commerce
        env:
          NPM_CONFIG_PROVENANCE: 'false'
